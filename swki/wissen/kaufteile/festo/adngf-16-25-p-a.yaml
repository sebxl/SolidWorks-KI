# Festo ADNGF-16-25-P-A: Kompaktzylinder Ø 16 mit Führung (Führungsstangen + Jochplatte, verdrehgesichert), Hub 25
# (Weichenkeil der Prüfstation AP 6.8, Etappe 4). Original: STEP aus dem Festo-CAD-Portal (Teile-Nr. 554216, Download
# 10.10.2026), Datenblatt: Festo-Katalog ADNGF, Stand 2026/09 (S. 6 Technische Daten, S. 7 Gewicht, S. 9 Werkstoffe,
# S. 10 Maßbild und Maßtabelle, S. 12 Bestellangaben). Beide liegen nur im Quellordner der Kaufteil-Bibliothek, nicht im Git.
# STEP-Koordinaten (Diagnose lauf-1, Vollanalyse): Achse x = y = 0, Richtung z, eingefahren. Zwei Körper:
# Gehäuse (z −60 … 0) und bewegte Einheit (Kolben, Stange Ø 8, Führungsstangen Ø 4 bei (−9/−9), (9/9), Jochplatte
# z 4,7 … 10,7). Rückseite z −60 mit Zentrierung D1 Ø 9 × 2,1. Jochplatte: 2 × M3 durchgehend (Kern Ø 2,459, Senkung Ø 3
# je Seite 0,27) auf Teilkreis D4 14 bei (−4,95/−4,95), (4,95/4,95), 2 × Stiftloch FB Ø 3 auf der anderen Diagonale,
# 2 × Ø 6 Durchgriff zu den vorderen Flanschschrauben. Befestigungsgewinde RT M4 in den Flanschschrauben, je Deckel eine
# Diagonale: hinten bei (−9/−9), (9/9) – Senkung Ø 9,2 bis z −55, Schraubenkopf, Ansenkung Ø 4 bis z −56,5 (Eintritt),
# Kernloch Ø 3,242 bis z −43 (ebener Grund); vorn bei (9/−9), (−9/9) hinter der Jochplatte (nicht nutzbar, nicht
# aufgenommen). Anschlüsse EE M5 auf +y: vorn x 2,6 z −6 (Grund y 7,8), hinten x −2,6 z −54 (Grund y 5,5).
# Gewindetiefen aus der Mantellänge der Kernlöcher (nicht belegt). Durchgehende M3 der Jochplatte: Schrauben dürfen
# hinten nicht über z 4,7 hinausragen (Spalt WH 4,7 zum Gehäuse, eingefahren).
