# Regelkatalog der Zeichnungsprüfung (Design 2026-11-16 §8.1, Plan Z1.4 Task 1). Prüfer und Code lesen dieselbe Liste.
# Eintrag: id, pruefung (eine der neun Prüfungen), text, quelle, beleg (A: >= 2 Quellen, B: eine Quelle, C: unbelegt),
# art (hart: Mangel macht den Lauf nicht bestanden; hinweis: nie ok false).
# quelle und beleg stammen aus docs/zeichnungsableitung/recherche.md (R-Kap. = Kapitel) und der Herkunftsspalte von
# Design §8.1. "Hausregel swki (Z1.4)" mit beleg C steht, wo die Recherche keinen Beleg hat. Erweitern nur mit Quelle.

- id: Z-VOLL-1
  pruefung: vollstaendig
  text: Jedes Merkmal des Maßplans ist bemaßt; jedes Spec-Maß der freigegebenen Kopie findet sich mit gleichem Wert.
  quelle: "R-Kap. 4/8 (Maßbedarf des Fertigers)"
  beleg: A
  art: hart
- id: Z-VOLL-2
  pruefung: vollstaendig
  text: Kein Doppelmaß; jedes Merkmal ist genau einmal bemaßt.
