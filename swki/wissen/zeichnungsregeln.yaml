# Regelkatalog der Zeichnungsprüfung (Design 2026-11-16 §8.1, Plan Z1.4 Task 1). Prüfer und Code lesen dieselbe Liste.
# Eintrag: id, pruefung (eine der neun Prüfungen), text, quelle, beleg, art, herkunft.
# beleg (A: >= 2 Quellen, B: eine Quelle, C: unbelegt) beschreibt nur die Norm- und Praxisstütze (docs/zeichnungsableitung/
# recherche.md, R-Kap. = Kapitel). art: hart (Mangel macht den Lauf nicht bestanden) oder hinweis (nie ok false).
# herkunft: norm (die Regel stützt sich auf Norm und Praxis) oder projekt (Entscheidung des Nutzers oder des Designs;
# quelle nennt dann Nutzer bzw. Design mit Datum oder Abschnitt).
# Invariante: art hart gilt nur mit beleg A oder B oder herkunft projekt (regeln.py prüft das beim Laden).
# Erweitern nur mit Quelle und Beleg.

