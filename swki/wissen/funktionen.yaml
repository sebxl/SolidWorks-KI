# Regeltabelle Funktion → Passung, Hülle, Rauheit, Form/Lage (Zeichnungsableitung, Design 2026-11-16 §4.3).
# Quelle der Werte: docs/zeichnungsableitung/recherche.md Kap. 7 (Passungen, Lagersitze) und Kap. 6 (Ra-Richtwerte).
# beleg je Wert: A = ≥ 2 unabhängige Quellen, B = eine Quelle, C = unbelegt. bestaetigt: true nur, wenn kein Wert C ist
# oder der Nutzer den Eintrag bestätigt hat; sonst meldet swki validieren den Eintrag (Hinweis art "funktion").
# Ⓔ (huelle) an allen Passmaßen: Entscheidung des Nutzers vom 16.11.2026 (ISO 8015, Hülle nur an Passmaßen).
# Rauheit in µm. form_lage mit it (ISO-286-Grundtoleranzgrad) statt wert; den Zahlenwert rechnet die Zeichnung.
# Erweitern nur mit Quelle und Beleg (wie andere Wissenstabellen).

