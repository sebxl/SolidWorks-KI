[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swki"
version = "0.1.0"
description = "SolidWorks-KI: Spezifikation, Compiler und Prüfung für Claude Code"
requires-python = ">=3.13"
dependencies = [
  "pywin32>=311",
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "numpy>=2.3",       # Geometrie-Steckbrief (swki pruefen)
  "scipy>=1.16",
  "trimesh>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
messstand = ["numpy>=2.3", "scipy>=1.16", "trimesh>=4.8"]
pdf = ["pymupdf>=1.26"]  # werkzeuge.pdf_seiten (Datenblätter lesen); swki braucht es nicht

[tool.setuptools.packages.find]
include = ["swki*"]

[tool.setuptools.package-data]
swki = ["wissen/*.md", "wissen/*.yaml", "wissen/normteile/*.yaml", "wissen/normteile/vorlagen/*.yaml",
        "wissen/normteile/vorlagen/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not sw\""
markers = ["sw: benötigt ein laufendes SolidWorks"]
