# Projektweite Voreinstellungen (im Git)
max_nachbesserungen: 3
bohrungsnorm: ISO   # Vorgabe für normbohrung (je Bohrung mit "norm" überschreibbar; Tabelle swki/wissen/bohrungsnormen.yaml)
namensschema:
  datei: "{auftrag}_{name}"
  eigenschaften: [Benennung, Material, Ersteller, Auftrag]
toleranzen:
  anker_mm: 0.1
  volumen_prozent: 0.5
api:
  max_jahr_compiler: 2025
# Bewegungen (Stufe 4a): Schritte je Bewegung (Vorgabe) und Speichergrenze von SolidWorks (Private Bytes) für swki pruefen
bewegung_schritte: 8
speicher_grenze_mb: 10000
