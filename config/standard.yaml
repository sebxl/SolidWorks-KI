# Projektweite Voreinstellungen (im Git)
max_nachbesserungen: 3
bohrungsnorm: ISO   # Vorgabe für normbohrung (je Bohrung mit "norm" überschreibbar; Tabelle swki/wissen/bohrungsnormen.yaml)
namensschema:
  datei: "{auftrag}_{name}"
  eigenschaften: [Benennung, Material, Ersteller, Auftrag]
toleranzen:
  anker_mm: 0.1
  volumen_prozent: 0.5
  verzahnung_mm: 0.005  # Kreise, Zahnweite, Teilung, Zahndicke (Spec 4b §4.5; Wert nach Spike S14a Zeile 3)
  winkel_grad: 0.01  # Formschräge: Winkel der Seitenflächen (Spec Formschräge §6.1; Wert nach Spike S16 Zeile 5)
api:
  max_jahr_compiler: 2025
# Bewegungen (Stufe 4a): Schritte je Bewegung (Vorgabe) und Speichergrenze von SolidWorks (Private Bytes) für swki pruefen
bewegung_schritte: 8
speicher_grenze_mb: 16000  # Sebastian 10.10.2026 (Frage 4 A): Prüfstation Etappe 4, zwei Bewegungen, 13,2 GB vor dem 2. Lauf; Rechner 31 GB
