  - {datei: durchlicht.yaml, alt: "50,0 vom Plattenrand +X (Hauptansicht blickt von +Y, links = +X)", neu: "47,0 vom Plattenrand +X (Hauptansicht blickt von +Y, links = +X)"}
  - {datei: durchlicht.yaml, alt: "(50 vom Plattenrand +X, 15,6 hoch)", neu: "(47 vom Plattenrand +X, 15,6 hoch)"}
erwartet: {knoten: [stecker], stichworte: [versetzt, verschoben, "3 mm"]}
