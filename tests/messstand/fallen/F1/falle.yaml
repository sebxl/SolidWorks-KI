id: F1
art: falle
beschreibung: Durchlicht – Stecker M12 in X gespiegelt (echt, AP 6.8 Durchlicht Lauf 4)
basis: "{arbeitsordner}/MESSSTAND/vorlagen/pruefstation"
dateien: [durchlicht.yaml]
aufgabe: durchlicht
eingaben: [auftraege/AP68-Pruefstation/eingabe/hersteller/AI_BL-S050075_Massbild.png]
spec: durchlicht.yaml
# Kommentare passend zum falschen Wert (ein falsch deutender Agent schreibt sie stimmig)
ersetzen:
  - {datei: durchlicht.yaml, alt: "  SX: 50 ", neu: "  SX: 25 "}
  - {datei: durchlicht.yaml, alt: "50,0 vom Plattenrand +X (Hauptansicht blickt von +Y, links = +X)", neu: "25,0 vom Plattenrand +X (Hauptansicht blickt von +Y, links = −X)"}
  - {datei: durchlicht.yaml, alt: "(50 vom Plattenrand +X, 15,6 hoch)", neu: "(25 vom Plattenrand +X, 15,6 hoch)"}
  - {datei: durchlicht.yaml, alt: "(Hauptansicht von +Y: links = +X)", neu: "(Hauptansicht von +Y: links = −X)"}
erwartet: {knoten: [stecker], stichworte: [gespiegelt, spiegelverkehrt, falsche seite]}
